# Production stack: Traefik (TLS, Cloudflare only) -> web (nginx) and api (Go) -> postgres.
# See README.md in this folder. Run every command from this folder.

name: impostor

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Inside the db network only. TLS is checked against the private CA of scripts/postgres-certs.sh
# (the certificate names the host "postgres").
x-database-url: &database-url postgres://${POSTGRES_USER:-impostor}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-impostor}?sslmode=verify-full&sslrootcert=/certs/postgres-ca.crt

# One image (../Dockerfile) holds the api, migrate and seed binaries.
x-server: &server
  build:
    context: ..
  image: impostor-server:local
  logging: *logging
  <<: *hardening
  environment:
    DATABASE_URL: *database-url
  volumes:
    - ./secrets/postgres/ca.crt:/certs/postgres-ca.crt:ro

services:
  traefik:
    image: traefik:v3.7.20@sha256:8301d6f60957a422f98918aacf2b01482abde3e74ead3719aabdb7c64045fe28
    restart: unless-stopped
    # On the host network, so ufw rules (INPUT chain) decide who reaches :443. Ports published by
    # Docker would bypass ufw. Traefik reaches web and api by their fixed addresses on "edge".
    network_mode: host
    logging: *logging
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    volumes:
      # Rendered by scripts/cloudflare.sh (Cloudflare IP ranges, domain).
      - ./generated/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./generated/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./generated/traefik/cloudflare-origin-pull-ca.pem:/etc/traefik/cloudflare-origin-pull-ca.pem:ro
      # Cloudflare Origin Certificate (origin.pem, origin.key).
      - ./secrets/traefik:/etc/traefik/origin:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - web
      - api

  web:
    build:
      context: ${WEB_DIR:-../../web}
    image: impostor-web:local
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    tmpfs:
      - /tmp
    networks:
      edge:
        ipv4_address: 172.30.10.11

  api:
    <<: *server
    restart: unless-stopped
    # TRUSTED_PROXIES: Traefik (the edge gateway) and Cloudflare, rendered by scripts/cloudflare.sh.
    env_file:
      - ./generated/api.env
    environment:
      APP_ENV: prod
      PORT: "8080"
      LOG_LEVEL: info
      # Origin of the app: the only one allowed to open WebSockets. Same origin, so no CORS.
      ALLOWED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
      ROOM_TTL: 24h
      EMPTY_ROOM_TTL: 1h
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    networks:
      edge:
        ipv4_address: 172.30.10.10
      db: {}

  # One-off jobs, run on every `docker compose up`: both are idempotent.
  migrate:
    <<: *server
    entrypoint: ["/app/migrate"]
    command: ["up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]

  seed:
    <<: *server
    entrypoint: ["/app/seed"]
    command: ["-release"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [db]

  postgres:
    image: postgres:17.12-alpine3.24@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-impostor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-impostor}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./secrets/postgres/server.crt:/etc/postgresql/tls/server.crt:ro
      - ./secrets/postgres/server.key:/etc/postgresql/tls/server.key:ro
    # No ports: reachable only from the db network.
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Traefik (host network) -> web and api. Fixed subnet: the API trusts X-Forwarded-For only from
  # its gateway (172.30.10.1, the host side of the bridge, where Traefik's requests come from).
  edge:
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1
  # api, migrate, seed -> postgres. No route to the outside world.
  db:
    internal: true

volumes:
  postgres-data:
