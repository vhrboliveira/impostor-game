# Hot reload configuration for `make dev` (https://github.com/air-verse/air).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "json", "sql"]
  exclude_dir = ["tmp", "bin", "docs", "docker", ".git", ".github"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  # Ask the server to shut down gracefully (SIGINT) before restarting it.
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[misc]
  clean_on_exit = true
